name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv>=0.8,<1"
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .
      - name: Test
        run: uv run pytest --cov=infraswe --cov-report=term-missing
      - name: Validate task package
        run: uv run infraswe task validate tasks/gpu-service-rollout-regression

